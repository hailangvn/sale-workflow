name: tests

on:
  pull_request:
    branches:
      - "19.0*"
  push:
    branches:
      - "19.0"
      - "19.0-ocabot-*"
  workflow_dispatch:

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v6
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: trobz/odoo-venv@v1.20.2
        with:
          python_version: "3.11"
          odoo_version: "19.0"
          oca_repos: "account-invoicing server-backend server-tools server-ux"
